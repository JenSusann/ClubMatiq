name: ClubMatiq CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/clubmatiq_ci

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Softwareversion anzeigen
        run: npm pkg get name version

      - name: Svelte und TypeScript prüfen
        run: npm run check

      - name: Unit-Tests und Code Coverage
        run: npm run test:coverage

      - name: Coverage-Bericht speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/unit/
          retention-days: 30
          if-no-files-found: warn

      - name: Produktions-Build erstellen
        run: npm run build
