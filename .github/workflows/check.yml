name: ClubMatiq CI

on:
  push:
    branches: [main, 'develop/**']
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'ROADMAP.md'
      - 'docs/releases/**'
      - 'docs/testing/**/*.md'
  pull_request:
    branches: [main, 'develop/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MONGODB_DB_NAME: clubmatiq_test
      MONGODB_URI: mongodb://127.0.0.1:27017/clubmatiq_ci

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Softwareversion anzeigen
        run: npm pkg get name version

      - name: Svelte und TypeScript prüfen
        run: npm run check

      - name: Unit-Tests und Code Coverage
        run: npm run test:coverage

      - name: Coverage-Bericht speichern
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unit-test-coverage
          path: coverage/unit/
          retention-days: 30
          if-no-files-found: warn

      - name: Produktions-Build erstellen
        run: npm run build

  integration:
    name: Integration Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MONGODB_DB_NAME: clubmatiq_test
      MONGODB_URI: mongodb://127.0.0.1:27017/clubmatiq_test?replicaSet=rs0
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/clubmatiq_test?replicaSet=rs0

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: MongoDB Replica Set starten
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name clubmatiq-mongo -p 127.0.0.1:27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for i in {1..60}; do
            if docker exec clubmatiq-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -qx 1; then
              break
            fi
            sleep 2
          done
          docker exec clubmatiq-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in {1..60}; do
            if docker exec clubmatiq-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -qx true; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB Replica Set nicht bereit"
          exit 1

      - name: Integrationstests und Code Coverage
        run: npm run test:integration

      - name: Integration-Coverage speichern
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: integration-test-coverage
          path: coverage/integration/
          retention-days: 30
          if-no-files-found: warn

      - name: MongoDB stoppen
        if: always()
        run: docker rm -f clubmatiq-mongo || true

  combined:
    name: Combined Coverage
    needs: [check, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Coverage-Artefakte herunterladen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" -n unit-test-coverage -D coverage/unit
          gh run download "$GITHUB_RUN_ID" -n integration-test-coverage -D coverage/integration
      - name: Kombinierte Coverage erstellen
        run: npm run coverage:merge
      - name: Kombinierte Coverage speichern
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: combined-test-coverage
          path: coverage/combined/
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [check, integration, combined]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Version prüfen
        shell: bash
        run: |
          node --input-type=commonjs -e '
            const p = require("./package.json");
            const l = require("./package-lock.json");
            const tag = process.env.GITHUB_REF_NAME;
            if (!/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$/.test(tag) || tag !== "v"+p.version || l.version !== p.version || l.packages[""].version !== p.version) {
              throw new Error("Git-Tag und Paketversionen stimmen nicht überein");
            }
          '
      - name: Coverage-Artefakte herunterladen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" -n unit-test-coverage -D release-assets/unit
          gh run download "$GITHUB_RUN_ID" -n integration-test-coverage -D release-assets/integration
          gh run download "$GITHUB_RUN_ID" -n combined-test-coverage -D release-assets/combined
          (cd release-assets/combined && zip -qr ../combined-test-coverage.zip .)
          (cd release-assets/unit && zip -qr ../unit-test-coverage.zip .)
          (cd release-assets/integration && zip -qr ../integration-test-coverage.zip .)
      - name: GitHub Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          args=()
          if [[ "$tag" == v0.* || "$tag" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$tag" --verify-tag --generate-notes --title "ClubMatiq $tag" "${args[@]}" release-assets/unit-test-coverage.zip release-assets/integration-test-coverage.zip release-assets/combined-test-coverage.zip
